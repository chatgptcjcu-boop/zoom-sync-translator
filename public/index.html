<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncSub 雙語字幕測試</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <section class="lobby">
    <div class="lobby-card lobby-card-wide">
      <h1 class="brand">Kiroku<span>Flow</span> 日中／中日字幕</h1>
      <p class="lead">這是招待制的雙向即時字幕服務。請使用 <strong>Chrome</strong> 或 Edge；主持人建立限時邀請連結後，受邀者不需要申請或輸入翻譯 API Key。</p>

      <ol class="guide-steps">
        <li>請向主持人取得專屬、尚未過期的邀請連結。</li>
        <li>在連結頁填寫顯示名稱後進入會議室。</li>
        <li>點「開始收音」，允許瀏覽器使用麥克風。</li>
        <li>請允許瀏覽器使用麥克風。建議把視窗放在 Zoom 旁邊對照字幕。</li>
      </ol>

      <p class="hint">
        需要建立會議邀請，請由服務管理者登入主持人入口；一般使用者不能自行建立公開會議室。
      </p>

      <footer class="site-legal">
        <p>版權所有 宜彤彥科技　統編 54904855</p>
        <p>可授權教育教學單位免費使用</p>
      </footer>
    </div>
  </section>
</body>
</html>
