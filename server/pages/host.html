<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KirokuFlow 日中／中日字幕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/socket.io/socket.io.js"></script>
  <script>window.__SYNCSUB_HOST__ = true;</script>
</head>
<body>
  <section id="lobby" class="lobby">
    <div class="lobby-card">
      <p class="badge-host">KirokuFlow · 招待制の会議字幕</p>
      <h1 class="brand">Kiroku<span>Flow</span> 字幕</h1>
      <p class="lead">主催者は会議番号を決め、教授用の期限付き招待リンクを作成してください。翻訳 API キーの入力は不要です。</p>

      <div class="field">
        <label for="displayName">顯示名稱</label>
        <input id="displayName" type="text" maxlength="40" placeholder="例如：張老師 / 田中教授" />
      </div>

      <div class="field">
        <label for="inviteRole">招待する参加者 / 受邀與會者</label>
        <select id="inviteRole"><option value="jp">日本端（日本語 → 繁體中文）</option><option value="tw">台灣端（繁中 → 日本語）</option></select>
        <label for="inviteExpiry" class="sub-label">招待の有効時間 / 邀請有效時間</label>
        <select id="inviteExpiry"><option value="2026-09-16T12:00:00+08:00" selected>9/16 會議＋提前練習（台灣 12:00／日本 13:00 截止）</option><option value="30">30 分</option><option value="45">45 分</option><option value="60">60 分</option></select>
        <p class="hint">9/16 正式會議：台灣 10:00／日本 11:00。此邀請建立後即可練習，會議當天沿用同一連結。</p>
        <button type="button" class="secondary-btn" id="createInviteBtn">招待リンクを作成 / 建立邀請</button>
        <input id="inviteOutput" type="text" readonly aria-label="招待連結" placeholder="建立後會顯示並複製邀請連結" />
      </div>

      <div class="field">
        <label for="roomId">會議房號（雙方相同）</label>
        <input id="roomId" type="text" maxlength="64" value="meeting-001" />
      </div>

      <div class="field">
        <label>我的身分（自動配對語系）</label>
        <div class="role-grid">
          <button type="button" class="role-btn active" data-role="tw" id="roleTw">
            <strong>台灣端</strong>
            <small>說中文 → 翻譯成日文</small>
          </button>
          <button type="button" class="role-btn" data-role="jp" id="roleJp">
            <strong>日本端</strong>
            <small>說日文 → 翻譯成中文</small>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="serverUrl">中繼站位址（本機預設即可）</label>
        <input id="serverUrl" type="text" value="" placeholder="空白 = 目前這個網站" />
      </div>

      <button type="button" class="primary-btn" id="enterBtn">進入會議室</button>
      <p class="hint">
        主催者の URL は共有しないでください。参加者には上で作成した期限付き URL のみを送ります。
      </p>
    </div>
  </section>

  <section id="room" class="room hidden">
    <header id="topbar" class="topbar">
      <div class="brand-mini">
        <i id="connDot" class="dot warn"></i>
        <span>SyncSub</span>
        <span id="roomLabel" style="color:var(--muted);font-weight:500;font-size:0.9rem"></span>
      </div>

      <div class="controls">
        <label class="chip">
          我的語言
          <select id="myLang">
            <option value="zh-TW">中文 (台灣)</option>
            <option value="ja-JP">日本語</option>
            <option value="en-US">English</option>
          </select>
        </label>
        <label class="chip">
          翻譯為
          <select id="targetLang">
            <option value="ja-JP">日本語</option>
            <option value="zh-TW">中文 (台灣)</option>
            <option value="en-US">English</option>
          </select>
        </label>
        <button type="button" class="action-btn" id="toggleBtn">開始收音</button>
        <div class="volume" id="volumeWrap" title="麥克風音量"><i id="volumeBar"></i></div>
        <button type="button" class="icon-btn" id="fontDown" title="字級縮小">A−</button>
        <button type="button" class="icon-btn" id="fontUp" title="字級放大">A+</button>
        <button type="button" class="icon-btn" id="exportBtn" title="匯出逐字稿">↓</button>
        <button type="button" class="icon-btn" id="leaveBtn" title="離開房間">✕</button>
        <button type="button" class="icon-btn" id="hidePanelBtn" title="隱藏面板">⌃</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <button type="button" class="icon-btn float-gear hidden" id="showPanelBtn" title="顯示面板">⚙</button>

      <div class="meta-row">
        <div>
          <div class="status-pill" id="statusPill">尚未連線</div>
          <div class="debug" id="debugLog"></div>
        </div>
        <div class="members-pill" id="membersPill">房間人數：0</div>
      </div>

      <div class="stream" id="stream">
        <div class="placeholder" id="placeholder">
          點「開始收音」後，你的發言會即時出現在這裡，<br />
          對方也會同步看到翻譯字幕。
        </div>
      </div>

      <div class="interim" id="interimBox">聽寫中...</div>
    </main>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
